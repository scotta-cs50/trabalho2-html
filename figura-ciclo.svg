  <text x="533" y="82" font-size="18" font-weight="bold" fill="#14213d">3. Execução</text>
  <text x="533" y="106" font-size="13" fill="#333333">faz a operação</text>
  <text x="533" y="124" font-size="13" fill="#333333">pedida</text>
  <line x1="190" y1="92" x2="234" y2="92" stroke="#14213d" stroke-width="3" marker-end="url(#seta)"/>
  <line x1="403" y1="92" x2="447" y2="92" stroke="#14213d" stroke-width="3" marker-end="url(#seta)"/>
  <path d="M533 140 C533 235 107 235 107 144" fill="none" stroke="#14213d" stroke-width="3" marker-end="url(#seta)"/>
  <text x="320" y="260" font-size="14" fill="#14213d">o ciclo recomeça com a próxima instrução</text>
